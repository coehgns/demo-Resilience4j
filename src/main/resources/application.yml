spring:
  application:
    name: demo-Resilience4j

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        permittedNumberOfCallsInHalfOpenState: 5
        registerHealthIndicator: true

management:
  endpoints:
    web:
      exposure:
        include:
          - "*" # ???? ?? actuator ?? ??

  health:
    circuit-breakers:
      enabled: true # circuitbreakers ?? ??